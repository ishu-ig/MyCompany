<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Teal Rounded Background -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="#0d9488" />
  
  <!-- Logo Elements Group -->
  <g fill="#ffffff" font-family="Courier New, monospace" font-weight="bold">
    
    <!-- Left Angle Bracket -->
    <text x="70" y="330" font-size="150">&lt;</text>
    
    <!-- The letter 'i' -->
    <text x="160" y="330" font-size="180">i</text>
    
    <!-- The letter 'G' -->
    <text x="230" y="340" font-size="210">G</text>
    
    <!-- Right Angle Bracket inside the G (Stylized) -->
    <text x="330" y="260" font-size="90">&gt;</text>
    
    <!-- Command Line Cursor (Underscore) -->
    <text x="340" y="330" font-size="90">_</text>
    
    <!-- Forward Slash -->
    <text x="390" y="420" font-size="140">/</text>
  </g>
</svg>
